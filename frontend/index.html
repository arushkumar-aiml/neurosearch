<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NeuroSearch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div class="grid-glow" aria-hidden="true"></div>

<main class="shell">

  <!-- ================= CONSOLE ================= -->
  <section class="console">

    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="13" cy="13" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="19.5" y1="19.5" x2="28" y2="28" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="9.5" cy="11" r="1.6" fill="currentColor"/>
        <circle cx="15.5" cy="9.5" r="1.6" fill="currentColor"/>
        <circle cx="13" cy="16" r="1.6" fill="currentColor"/>
        <path d="M9.5 11 L15.5 9.5 M15.5 9.5 L13 16 M13 16 L9.5 11" stroke="currentColor" stroke-width="1" opacity="0.7"/>
      </svg>
      <h1>NeuroSearch</h1>
      <p class="tagline">Searches by meaning, not just matching words.</p>
    </div>

    <div class="search-row">
      <input
        id="query"
        type="search"
        class="search-input"
        placeholder="Ask anything — try &ldquo;how do computers understand language&rdquo;"
        autocomplete="off"
        spellcheck="false"
        aria-label="Search query"
      />
      <button id="searchBtn" class="search-btn" type="button">Search</button>
      <div id="suggestList" class="suggest-list is-hidden" role="listbox"></div>
    </div>

    <!-- The mixing control: this is the whole point of the project -->
    <div class="mixer" id="mixer">
      <div class="mixer-head">
        <span class="mixer-title">Ranking mix</span>
        <div class="mode-switch" role="group" aria-label="Search mode">
          <button class="mode-btn" data-mode="keyword" type="button">Keyword</button>
          <button class="mode-btn is-active" data-mode="hybrid" type="button">Hybrid</button>
          <button class="mode-btn" data-mode="semantic" type="button">Semantic</button>
        </div>
      </div>

      <div class="slider-block" id="sliderBlock">
        <div class="slider-poles">
          <span class="pole pole-keyword">
            <i class="dot dot-keyword"></i>BM25 keyword
            <b id="keywordPct">50%</b>
          </span>
          <span class="pole pole-semantic">
            <b id="semanticPct">50%</b>
            neural semantic<i class="dot dot-semantic"></i>
          </span>
        </div>
        <input
          id="alpha"
          class="slider"
          type="range"
          min="0" max="100" value="50" step="5"
          aria-label="Balance between keyword and semantic ranking"
        />
      </div>
    </div>

    <div class="status-bar">
      <span id="status" class="status">Checking index…</span>
    </div>

  </section>

  <!-- ================= RESULTS ================= -->
  <section id="results" class="results" aria-live="polite"></section>

  <footer class="foot">
    <span>NeuroSearch — BM25 + sentence embeddings, built from scratch</span>
    <a href="https://github.com/arushkumar-aiml/neurosearch" target="_blank" rel="noopener">github.com/arushkumar-aiml</a>
  </footer>

</main>

<script src="/static/script.js"></script>
</body>
</html>
